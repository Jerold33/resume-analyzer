spring.application.name=resume-analyzer
server.port=8080

# Default when no SPRING_PROFILES_ACTIVE is set (local). Tests use @ActiveProfiles("test").
spring.profiles.default=dev

# Multipart uploads (PDF / Word)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT (override via environment in production)
# At least 32 bytes for HS256. Override in production with a long random string.
app.jwt.secret=${JWT_SECRET:dev-jwt-secret-change-me-in-production-32b}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# OpenAI (never commit real keys)
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
app.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.openai.connect-timeout-ms=${OPENAI_CONNECT_TIMEOUT_MS:10000}
app.openai.read-timeout-ms=${OPENAI_READ_TIMEOUT_MS:120000}

# Resume text sent to the model (character cap before tokenization)
app.resume.max-chars-for-ai=15000

logging.level.com.example.resumeanalyzer=INFO
